server.port=${PORT:8080}

# Base de datos SQLite local (se crea sola al arrancar)
spring.datasource.url=jdbc:sqlite:usuarios.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# La misma clave debe estar configurada en ms-productos y ms-compras (.env)
jwt.secret=${JWT_SECRET:TiendaMicroserviciosJWT2026ClaveSegura!}
jwt.expiracion-horas=8
